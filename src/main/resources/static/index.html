<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý & Xuất Bảng Lương</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body class="bg-slate-100 text-gray-800 antialiased">
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_COLUMNS = [
        { key: 'fullName', label: 'Họ Và Tên Nhân Viên', enabled: true },
        { key: 'role', label: 'Chức Vụ', enabled: true },
        { key: 'dob', label: 'Ngày Tháng Năm Sinh', enabled: true },
        { key: 'idCardNumber', label: 'Số CCCD', enabled: true },
        { key: 'idCardIssuedDate', label: 'Ngày Cấp', enabled: true },
        { key: 'idCardIssuedPlace', label: 'Nơi Cấp', enabled: true },
        { key: 'address', label: 'Địa Chỉ (Trên CCCD)', enabled: true },
        { key: 'taxCode', label: 'Mã Số Thuế', enabled: true },
        { key: 'bankAccountNumber', label: 'Số TK', enabled: true },
        { key: 'bankInfo', label: 'Ngân Hàng, Chi Nhánh', enabled: true },
        { key: 'email', label: 'Mail', enabled: true },
        { key: 'phone', label: 'Số điện thoại', enabled: true },
        { key: 'totalSalary', label: 'Tổng Lương', enabled: false },
        { key: 'note', label: 'Ghi Chú', enabled: false }
    ];

    function App() {
        const [activeTab, setActiveTab] = useState('muc3');
        const [permList, setPermList] = useState([]);
        const [masterList, setMasterList] = useState([]);
        const [trashList, setTrashList] = useState([]);

        const [selectedPermIds, setSelectedPermIds] = useState(new Set());
        const [selectedTrashIds, setSelectedTrashIds] = useState(new Set());

        const [columns, setColumns] = useState(() => {
            const saved = localStorage.getItem('payroll_custom_columns_v5');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) {}
            }
            return DEFAULT_COLUMNS;
        });

        const [showColModal, setShowColModal] = useState(false);

        // Modal Chỉnh sửa trực tiếp
        const [editingEmp, setEditingEmp] = useState(null);

        // Modal Thêm tay
        const [showManualModal, setShowManualModal] = useState(false);
        const [manualForm, setManualForm] = useState({
            fullName: '', role: 'SUP', dob: '', idCardNumber: '',
            idCardIssuedDate: '', idCardIssuedPlace: 'Cục CS QLHC và TTXH', address: '',
            taxCode: '', bankAccountNumber: '', bankInfo: '',
            email: '', phone: '', totalSalary: '', note: ''
        });

        const [alert, setAlert] = useState(null);

        useEffect(() => {
            fetchEmployees();
            fetchTrashList();
        }, []);

        useEffect(() => {
            localStorage.setItem('payroll_custom_columns_v5', JSON.stringify(columns));
        }, [columns]);

        const fetchEmployees = async () => {
            try {
                const res = await axios.get('/api/employees');
                setPermList(res.data);
            } catch (e) { console.error(e); }
        };

        const fetchTrashList = async () => {
            try {
                const res = await axios.get('/api/employees/trash');
                setTrashList(res.data);
            } catch (e) { console.error(e); }
        };

        const moveColumn = (index, direction) => {
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= columns.length) return;
            const newCols = [...columns];
            const temp = newCols[index];
            newCols[index] = newCols[targetIndex];
            newCols[targetIndex] = temp;
            setColumns(newCols);
        };

        const toggleColumn = (key) => {
            setColumns(columns.map(c => c.key === key ? { ...c, enabled: !c.enabled } : c));
        };

        const resetColumns = () => {
            setColumns(DEFAULT_COLUMNS);
            setAlert({ type: 'success', msg: 'Đã đặt lại thứ tự cột chuẩn!' });
        };

        const activeColumns = columns.filter(c => c.enabled);

        // Lưu Chỉnh sửa trực tiếp vào DB
        const handleSaveEdit = async (e) => {
            e.preventDefault();
            try {
                const res = await axios.post(`/api/employees/${editingEmp.id}`, editingEmp);
                setAlert({ type: 'success', msg: `Đã cập nhật thông tin nhân sự "${res.data.fullName}" thành công!` });
                setEditingEmp(null);
                fetchEmployees();
                setMasterList(prev => prev.map(m => m.id === editingEmp.id ? res.data : m));
            } catch (err) {
                let msg = 'Lỗi cập nhật: ' + err.message;
                if (err.response && err.response.data) msg = err.response.data;
                setAlert({ type: 'error', msg });
            }
        };

        // Xuất Excel
        const exportExcel = async (listToExport) => {
            if (listToExport.length === 0) {
                setAlert({ type: 'error', msg: 'Danh sách xuất trống!' });
                return;
            }
            try {
                const payload = {
                    employees: listToExport,
                    columns: activeColumns.map(c => ({ key: c.key, label: c.label }))
                };
                const res = await axios.post('/api/employees/export-custom-columns', payload, { responseType: 'blob' });
                const url = window.URL.createObjectURL(new Blob([res.data]));
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', 'Bang_Luong_Chuan_Mau.xlsx');
                document.body.appendChild(link);
                link.click();
                link.remove();
                setAlert({ type: 'success', msg: 'Đã xuất file Excel chuẩn form thành công!' });
            } catch (err) { setAlert({ type: 'error', msg: 'Lỗi xuất Excel: ' + err.message }); }
        };

        // Thêm tay
        const handleManualSubmit = async (e) => {
            e.preventDefault();
            try {
                await axios.post('/api/employees/manual', manualForm);
                setAlert({ type: 'success', msg: 'Thêm mới nhân sự thành công!' });
                setShowManualModal(false);
                setManualForm({
                    fullName: '', role: 'SUP', dob: '', idCardNumber: '',
                    idCardIssuedDate: '', idCardIssuedPlace: 'Cục CS QLHC và TTXH', address: '',
                    taxCode: '', bankAccountNumber: '', bankInfo: '',
                    email: '', phone: '', totalSalary: '', note: ''
                });
                fetchEmployees();
            } catch (err) {
                let msg = 'Lỗi: ' + err.message;
                if (err.response && err.response.data) msg = err.response.data;
                setAlert({ type: 'error', msg });
            }
        };

        // Import Excel
        const handleUploadExcel = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            try {
                const res = await axios.post('/api/employees/import-excel', formData);
                setAlert({ type: 'success', msg: res.data.message });
                fetchEmployees();
            } catch (err) { setAlert({ type: 'error', msg: 'Lỗi import: ' + err.message }); }
        };

        // Xóa mềm
        const handleSoftDelete = async (selectedIds, refreshFunc, setSelectFunc) => {
            if (selectedIds.size === 0) return;
            if (!window.confirm(`Chuyển ${selectedIds.size} nhân sự vào Thùng rác?`)) return;
            try {
                const res = await axios.post('/api/employees/soft-delete', Array.from(selectedIds));
                setAlert({ type: 'success', msg: res.data });
                setSelectFunc(new Set());
                refreshFunc();
                fetchTrashList();
            } catch (err) { setAlert({ type: 'error', msg: err.message }); }
        };

        // Khôi phục
        const handleRestore = async () => {
            if (selectedTrashIds.size === 0) return;
            try {
                const res = await axios.post('/api/employees/restore', Array.from(selectedTrashIds));
                setAlert({ type: 'success', msg: res.data });
                setSelectedTrashIds(new Set());
                fetchTrashList();
                fetchEmployees();
            } catch (err) { setAlert({ type: 'error', msg: err.message }); }
        };

        // Xóa vĩnh viễn
        const handleHardDelete = async () => {
            if (selectedTrashIds.size === 0) return;
            if (!window.confirm(`XÓA VĨNH VIỄN ${selectedTrashIds.size} nhân sự?`)) return;
            try {
                const res = await axios.post('/api/employees/hard-delete', Array.from(selectedTrashIds));
                setAlert({ type: 'success', msg: res.data });
                setSelectedTrashIds(new Set());
                fetchTrashList();
            } catch (err) { setAlert({ type: 'error', msg: err.message }); }
        };

        const addToMaster = (sourceList, selectedIds) => {
            const toAdd = sourceList.filter(item => selectedIds.has(item.id));
            const currentIds = new Set(masterList.map(m => m.id));
            const newItems = toAdd.filter(item => !currentIds.has(item.id));
            setMasterList([...masterList, ...newItems]);
            setAlert({ type: 'success', msg: `Đã đưa ${newItems.length} nhân sự vào Mục 4!` });
        };

        const moveRow = (index, direction) => {
            const newList = [...masterList];
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= newList.length) return;
            const temp = newList[index];
            newList[index] = newList[targetIndex];
            newList[targetIndex] = temp;
            setMasterList(newList);
        };

        const shuffleMaster = () => {
            setMasterList([...masterList].sort(() => Math.random() - 0.5));
            setAlert({ type: 'success', msg: 'Đã xáo trộn ngẫu nhiên thứ tự các dòng!' });
        };

        const toggleSelectAll = (list, selectedSet, setFunc) => {
            if (selectedSet.size === list.length) setFunc(new Set());
            else setFunc(new Set(list.map(i => i.id)));
        };

        const toggleSelectItem = (id, selectedSet, setFunc) => {
            const next = new Set(selectedSet);
            if (next.has(id)) next.delete(id);
            else next.add(id);
            setFunc(next);
        };

        const getVal = (emp, key) => {
            if (!emp) return '';
            return emp[key] || '-';
        };

        // Bảng render dữ liệu
        const renderTable = (items, selectedSet, setFunc, isMasterTab = false) => (
            <div class="overflow-x-auto border rounded-xl shadow-sm bg-white">
                <table class="min-w-full divide-y divide-gray-200 text-xs text-left">
                    <thead class="bg-[#cfe2f3] text-gray-900 font-bold sticky top-0 z-10 border-b">
                        <tr>
                            {setFunc && (
                                <th class="p-3 w-10 text-center border-r border-blue-200">
                                    <input type="checkbox" title="Chọn tất cả"
                                        checked={items.length > 0 && selectedSet.size === items.length}
                                        onChange={() => toggleSelectAll(items, selectedSet, setFunc)} />
                                </th>
                            )}
                            <th class="p-3 text-center w-14 border-r border-blue-200">Sửa</th>
                            {isMasterTab && <th class="p-3 text-center w-20 border-r border-blue-200">Đổi Dòng</th>}

                            {activeColumns.map((col, idx) => (
                                <th key={col.key} class="p-3 whitespace-nowrap group hover:bg-[#b8d6f0] border-r border-blue-200 transition">
                                    <div class="flex items-center justify-between gap-1.5">
                                        <span>{col.label}</span>
                                        <div class="inline-flex space-x-0.5 opacity-40 group-hover:opacity-100">
                                            <button onClick={() => moveColumn(columns.findIndex(c => c.key === col.key), -1)}
                                                disabled={idx === 0} title="Dịch cột sang trái"
                                                class="px-1 py-0.5 bg-white border border-blue-300 rounded hover:bg-blue-50 text-[10px] disabled:opacity-20">◀</button>
                                            <button onClick={() => moveColumn(columns.findIndex(c => c.key === col.key), 1)}
                                                disabled={idx === activeColumns.length - 1} title="Dịch cột sang phải"
                                                class="px-1 py-0.5 bg-white border border-blue-300 rounded hover:bg-blue-50 text-[10px] disabled:opacity-20">▶</button>
                                        </div>
                                    </div>
                                </th>
                            ))}

                            {isMasterTab && <th class="p-3 text-center w-12">Xóa</th>}
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        {items.map((emp, rowIdx) => (
                            <tr key={emp.id || rowIdx} onDoubleClick={() => setEditingEmp({...emp})}
                                title="Nhấp đúp chuột để chỉnh sửa nhân sự này"
                                class="hover:bg-blue-50/50 cursor-pointer transition">
                                {setFunc && (
                                    <td class="p-3 text-center" onClick={e => e.stopPropagation()}>
                                        <input type="checkbox"
                                            checked={selectedSet.has(emp.id)}
                                            onChange={() => toggleSelectItem(emp.id, selectedSet, setFunc)} />
                                    </td>
                                )}
                                <td class="p-3 text-center border-r border-gray-100" onClick={e => e.stopPropagation()}>
                                    <button onClick={() => setEditingEmp({...emp})} title="Chỉnh sửa thông tin"
                                        class="px-2 py-1 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 rounded font-semibold text-[11px] shadow-sm">
                                        ✏️ Sửa
                                    </button>
                                </td>
                                {isMasterTab && (
                                    <td class="p-3 text-center space-x-1 whitespace-nowrap border-r border-gray-100" onClick={e => e.stopPropagation()}>
                                        <button onClick={() => moveRow(rowIdx, -1)} disabled={rowIdx === 0}
                                            class="px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded disabled:opacity-30">⬆️</button>
                                        <button onClick={() => moveRow(rowIdx, 1)} disabled={rowIdx === items.length - 1}
                                            class="px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded disabled:opacity-30">⬇️</button>
                                    </td>
                                )}

                                {activeColumns.map(col => (
                                    <td key={col.key} class="p-3 whitespace-nowrap border-r border-gray-100">
                                        {col.key === 'fullName' && <span class="font-bold text-gray-900">{emp.fullName}</span>}
                                        {col.key === 'idCardNumber' && <span class="font-mono font-bold text-indigo-700">{emp.idCardNumber}</span>}
                                        {col.key === 'bankAccountNumber' && <span class="font-mono font-semibold text-emerald-700">{emp.bankAccountNumber}</span>}
                                        {col.key === 'totalSalary' && <span class="font-bold text-emerald-700">{emp.totalSalary || '-'}</span>}
                                        {col.key === 'note' && <span class="italic text-gray-600">{emp.note || '-'}</span>}
                                        {['fullName', 'idCardNumber', 'bankAccountNumber', 'totalSalary', 'note'].indexOf(col.key) === -1 && (
                                            <span>{getVal(emp, col.key)}</span>
                                        )}
                                    </td>
                                ))}

                                {isMasterTab && (
                                    <td class="p-3 text-center" onClick={e => e.stopPropagation()}>
                                        <button onClick={() => setMasterList(masterList.filter((_, i) => i !== rowIdx))}
                                            class="text-red-500 hover:text-red-700 font-bold">✕</button>
                                    </td>
                                )}
                            </tr>
                        ))}
                        {items.length === 0 && (
                            <tr>
                                <td colspan={activeColumns.length + 4} class="p-8 text-center text-gray-400">Chưa có dữ liệu nào.</td>
                            </tr>
                        )}
                    </tbody>
                </table>
            </div>
        );

        return (
            <div class="min-h-screen flex flex-col">
                {/* Header */}
                <header class="bg-indigo-900 text-white shadow-md">
                    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
                        <div>
                            <h1 class="text-xl font-bold">Hệ Thống Quản Lý & Xuất Bảng Lương</h1>
                            <p class="text-xs text-indigo-300">Chỉnh sửa trực tiếp, Di chuyển cột & Xuất form bảng lương</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onClick={() => setActiveTab('muc3')}
                                class={`px-3 py-1.5 rounded-lg text-xs font-bold ${activeTab === 'muc3' ? 'bg-indigo-600 text-white' : 'hover:bg-indigo-800 text-gray-300'}`}>
                                📋 MỤC 3: Danh Sách Nhân Sự ({permList.length})
                            </button>

                            <button onClick={() => setActiveTab('muc4')}
                                class={`px-3 py-1.5 rounded-lg text-xs font-bold ${activeTab === 'muc4' ? 'bg-amber-500 text-white shadow' : 'bg-amber-600/60 hover:bg-amber-600 text-white'}`}>
                                ⭐ MỤC 4: Bảng Lương Tổng Hợp ({masterList.length})
                            </button>

                            <button onClick={() => setActiveTab('trash')}
                                class={`px-3 py-1.5 rounded-lg text-xs font-bold ${activeTab === 'trash' ? 'bg-rose-600 text-white' : 'bg-gray-700 hover:bg-gray-600 text-gray-300'}`}>
                                🗑️ Thùng Rác ({trashList.length})
                            </button>
                            <button onClick={() => setActiveTab('backup')}
                                class={`px-3 py-1.5 rounded-lg text-xs font-bold ${activeTab === 'backup' ? 'bg-teal-600 text-white' : 'bg-gray-700 hover:bg-gray-600 text-gray-300'}`}>
                                💾 Backup
                            </button>
                        </div>
                    </div>
                </header>

                {/* Alert Toast */}
                {alert && (
                    <div class="max-w-7xl mx-auto px-4 mt-3 w-full">
                        <div class={`p-3 rounded-lg flex justify-between items-center text-sm shadow ${alert.type === 'error' ? 'bg-red-100 text-red-800 border-l-4 border-red-500' : 'bg-emerald-100 text-emerald-800 border-l-4 border-emerald-500'}`}>
                            <span>{alert.msg}</span>
                            <button onClick={() => setAlert(null)} class="font-bold ml-4">✕</button>
                        </div>
                    </div>
                )}

                <main class="max-w-7xl mx-auto px-4 py-5 flex-1 w-full space-y-6">
                    {/* THANH ĐIỀU HƯỚNG TÙY BIẾN CỘT */}
                    <div class="bg-indigo-50 border border-indigo-200 p-3 rounded-xl flex flex-wrap justify-between items-center gap-2 text-xs">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-indigo-900">💡 Mẹo:</span>
                            <span class="text-gray-600">Bấm nút <b>✏️ Sửa</b> hoặc <b>nhấp đúp chuột</b> vào bất kỳ dòng nào để chỉnh sửa trực tiếp thông tin!</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onClick={() => setShowColModal(true)}
                                class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1.5 rounded-lg shadow">
                                ⚙️ Sắp Xếp & Chọn Cột ({activeColumns.length}/{columns.length})
                            </button>
                            <button onClick={resetColumns}
                                class="bg-white hover:bg-gray-100 border text-gray-700 px-3 py-1.5 rounded-lg">
                                Đặt Lại Chuẩn Mẫu
                            </button>
                        </div>
                    </div>

                    {/* MỤC 3: MASTER DATA */}
                    {activeTab === 'muc3' && (
                        <div class="space-y-4">
                            <div class="bg-white p-5 rounded-xl shadow-sm border flex flex-wrap justify-between items-center gap-3">
                                <div>
                                    <h2 class="text-lg font-bold">MỤC 3: Danh Sách Nhân Sự Master ({permList.length})</h2>
                                    <p class="text-xs text-gray-500">Quản lý toàn bộ nhân viên. Bạn có thể chọn và đẩy sang Mục 4 để xuất bảng lương.</p>
                                </div>
                                <div class="flex flex-wrap gap-2">
                                    <label class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3.5 py-2 rounded-lg text-xs shadow cursor-pointer">
                                        📥 Import Excel
                                        <input type="file" accept=".xlsx" onChange={handleUploadExcel} class="hidden" />
                                    </label>
                                    <button onClick={() => setShowManualModal(true)}
                                        class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-3.5 py-2 rounded-lg text-xs shadow">
                                        ➕ Thêm Mới
                                    </button>
                                    <button onClick={() => {
                                        const selected = permList.filter(p => selectedPermIds.has(p.id));
                                        exportExcel(selected.length > 0 ? selected : permList);
                                    }} class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3.5 py-2 rounded-lg text-xs shadow">
                                        📥 Xuất Excel Chuẩn Form
                                    </button>
                                    <button onClick={() => addToMaster(permList, selectedPermIds)}
                                        disabled={selectedPermIds.size === 0}
                                        class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 text-white font-bold px-3.5 py-2 rounded-lg text-xs shadow">
                                        ➕ Đưa Vào Mục 4 ({selectedPermIds.size})
                                    </button>
                                    <button onClick={() => handleSoftDelete(selectedPermIds, fetchEmployees, setSelectedPermIds)}
                                        disabled={selectedPermIds.size === 0}
                                        class="bg-rose-600 hover:bg-rose-700 disabled:opacity-40 text-white font-bold px-3 py-2 rounded-lg text-xs shadow">
                                        🗑️ Xóa ({selectedPermIds.size})
                                    </button>
                                </div>
                            </div>
                            {renderTable(permList, selectedPermIds, setSelectedPermIds, false)}
                        </div>
                    )}

                    {/* MỤC 4: BẢNG LƯƠNG TỔNG HỢP */}
                    {activeTab === 'muc4' && (
                        <div class="space-y-4">
                            <div class="bg-white p-5 rounded-xl shadow-sm border flex flex-wrap justify-between items-center gap-3">
                                <div>
                                    <h2 class="text-lg font-bold text-amber-900">MỤC 4: Bảng Lương Tổng Hợp ({masterList.length})</h2>
                                    <p class="text-xs text-gray-500">Đổi thứ tự dòng và cột theo đúng mẫu bảng lương yêu cầu trước khi xuất file.</p>
                                </div>
                                <div class="flex flex-wrap gap-2">
                                    <button onClick={shuffleMaster} disabled={masterList.length === 0}
                                        class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-3.5 py-2 rounded-lg text-xs shadow disabled:opacity-40">
                                        🔀 Trộn Ngẫu Nhiên Dòng
                                    </button>
                                    <button onClick={() => exportExcel(masterList)} disabled={masterList.length === 0}
                                        class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-xs shadow disabled:opacity-40">
                                        📥 Xuất Excel Chuẩn Form ({masterList.length})
                                    </button>
                                    <button onClick={() => { if(window.confirm('Dọn sạch bảng Mục 4?')) setMasterList([]); }}
                                        disabled={masterList.length === 0}
                                        class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-3 py-2 rounded-lg text-xs disabled:opacity-40">
                                        Dọn Sạch
                                    </button>
                                </div>
                            </div>
                            {renderTable(masterList, null, null, true)}
                        </div>
                    )}

                    {/* THÙNG RÁC */}
                    {activeTab === 'trash' && (
                        <div class="space-y-4">
                            <div class="bg-white p-5 rounded-xl shadow-sm border flex flex-wrap justify-between items-center gap-3">
                                <div>
                                    <h2 class="text-lg font-bold text-rose-800">🗑️ Thùng Rác (Đã Xóa Mềm - {trashList.length})</h2>
                                    <p class="text-xs text-gray-500">Nhân sự xóa nhầm nằm ở đây, có thể khôi phục lại nguyên vẹn.</p>
                                </div>
                                <div class="flex space-x-2">
                                    <button onClick={handleRestore} disabled={selectedTrashIds.size === 0}
                                        class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-xs shadow disabled:opacity-40">
                                        ♻️ Khôi Phục ({selectedTrashIds.size})
                                    </button>
                                    <button onClick={handleHardDelete} disabled={selectedTrashIds.size === 0}
                                        class="bg-red-700 hover:bg-red-800 text-white font-bold px-4 py-2 rounded-lg text-xs shadow disabled:opacity-40">
                                        🔥 Xóa Vĩnh Viễn ({selectedTrashIds.size})
                                    </button>
                                </div>
                            </div>
                            {renderTable(trashList, selectedTrashIds, setSelectedTrashIds, false)}
                        </div>
                    )}

                    {/* BACKUP */}
                    {activeTab === 'backup' && (
                        <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-sm border space-y-6">
                            <div class="border-b pb-3">
                                <h2 class="text-xl font-bold text-gray-800">💾 Sao Lưu & Phục Hồi Dữ Liệu</h2>
                                <p class="text-sm text-gray-500">Sao lưu ra file Excel toàn bộ dữ liệu, mở xem được bằng Excel</p>
                            </div>
                            <div class="space-y-4">
                                <div class="p-4 border rounded-xl bg-slate-50 flex justify-between items-center">
                                    <div>
                                        <h4 class="font-bold text-gray-800">1. Tải File Sao Lưu Toàn Bộ (Backup)</h4>
                                        <p class="text-xs text-gray-500">Tải file `Payroll_Backup_All.xlsx` về máy tính</p>
                                    </div>
                                    <a href="/api/employees/backup" target="_blank"
                                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2.5 rounded-lg text-xs shadow inline-block">
                                        ⬇️ Tải File Sao Lưu
                                    </a>
                                </div>
                                <div class="p-4 border rounded-xl bg-slate-50 flex justify-between items-center">
                                    <div>
                                        <h4 class="font-bold text-gray-800">2. Phục Hồi Từ File Sao Lưu (Restore)</h4>
                                        <p class="text-xs text-gray-500">Chọn file Excel backup để nạp lại vào Database</p>
                                    </div>
                                    <label class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2.5 rounded-lg text-xs shadow cursor-pointer">
                                        ⬆️ Chọn File Phục Hồi
                                        <input type="file" accept=".xlsx" onChange={e => {
                                            const file = e.target.files[0];
                                            if (!file) return;
                                            const formData = new FormData();
                                            formData.append('file', file);
                                            axios.post('/api/employees/restore-backup', formData)
                                                .then(res => { setAlert({ type: 'success', msg: res.data.message }); fetchEmployees(); })
                                                .catch(err => setAlert({ type: 'error', msg: 'Lỗi: ' + err.message }));
                                        }} class="hidden" />
                                    </label>
                                </div>
                            </div>
                        </div>
                    )}
                </main>

                {/* MODAL CHỈNH SỬA TRỰC TIẾP DỮ LIỆU */}
                {editingEmp && (
                    <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                        <div class="bg-white rounded-2xl p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl">
                            <div class="flex justify-between items-center border-b pb-3 mb-4">
                                <div>
                                    <h3 class="font-bold text-lg text-indigo-900">✏️ Chỉnh Sửa Trực Tiếp Nhân Sự</h3>
                                    <p class="text-xs text-gray-500">Thay đổi thông tin và bấm Lưu để cập nhật ngay vào Database</p>
                                </div>
                                <button onClick={() => setEditingEmp(null)} class="text-gray-400 font-bold text-xl hover:text-gray-600">✕</button>
                            </div>
                            <form onSubmit={handleSaveEdit} class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                <div>
                                    <label class="font-semibold block mb-1">Họ Và Tên Nhân Viên *</label>
                                    <input type="text" required value={editingEmp.fullName || ''}
                                        onChange={e => setEditingEmp({...editingEmp, fullName: e.target.value})} class="w-full border rounded p-2 focus:ring-2 focus:ring-indigo-500 font-semibold" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Chức Vụ *</label>
                                    <select value={editingEmp.role || 'SUP'} onChange={e => setEditingEmp({...editingEmp, role: e.target.value})} class="w-full border rounded p-2 bg-white">
                                        <option value="SUP">SUP</option>
                                        <option value="PG">PG</option>
                                        <option value="PB">PB</option>
                                        <option value="STAFF">STAFF</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Ngày Tháng Năm Sinh</label>
                                    <input type="text" value={editingEmp.dob || ''} placeholder="03/05/2005"
                                        onChange={e => setEditingEmp({...editingEmp, dob: e.target.value})} class="w-full border rounded p-2" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Số CCCD *</label>
                                    <input type="text" required value={editingEmp.idCardNumber || ''}
                                        onChange={e => setEditingEmp({...editingEmp, idCardNumber: e.target.value})} class="w-full border rounded p-2 font-mono font-bold text-indigo-700" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Ngày Cấp</label>
                                    <input type="text" value={editingEmp.idCardIssuedDate || ''}
                                        onChange={e => setEditingEmp({...editingEmp, idCardIssuedDate: e.target.value})} class="w-full border rounded p-2" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Nơi Cấp</label>
                                    <select value={editingEmp.idCardIssuedPlace || 'Cục CS QLHC và TTXH'} onChange={e => setEditingEmp({...editingEmp, idCardIssuedPlace: e.target.value})}
                                        class="w-full border rounded p-2 bg-white">
                                        <option value="BỘ CÔNG AN">BỘ CÔNG AN</option>
                                        <option value="Cục CS QLHC và TTXH">Cục CS QLHC và TTXH</option>
                                    </select>
                                </div>
                                <div class="sm:col-span-2">
                                    <label class="font-semibold block mb-1">Địa Chỉ (Trên CCCD)</label>
                                    <input type="text" value={editingEmp.address || ''}
                                        onChange={e => setEditingEmp({...editingEmp, address: e.target.value})} class="w-full border rounded p-2" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Mã Số Thuế</label>
                                    <input type="text" value={editingEmp.taxCode || ''}
                                        onChange={e => setEditingEmp({...editingEmp, taxCode: e.target.value})} class="w-full border rounded p-2 font-mono" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Số TK *</label>
                                    <input type="text" required value={editingEmp.bankAccountNumber || ''}
                                        onChange={e => setEditingEmp({...editingEmp, bankAccountNumber: e.target.value})} class="w-full border rounded p-2 font-mono font-bold text-emerald-700" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Ngân Hàng, Chi Nhánh *</label>
                                    <input type="text" required value={editingEmp.bankInfo || ''} placeholder="VD: Vietcombank - Tây Sài Gòn"
                                        onChange={e => setEditingEmp({...editingEmp, bankInfo: e.target.value})} class="w-full border rounded p-2 font-medium" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Mail</label>
                                    <input type="email" value={editingEmp.email || ''}
                                        onChange={e => setEditingEmp({...editingEmp, email: e.target.value})} class="w-full border rounded p-2" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Số điện thoại</label>
                                    <input type="text" value={editingEmp.phone || ''}
                                        onChange={e => setEditingEmp({...editingEmp, phone: e.target.value})} class="w-full border rounded p-2 font-mono" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Tổng Lương</label>
                                    <input type="text" value={editingEmp.totalSalary || ''} placeholder="VD: 1.720.000"
                                        onChange={e => setEditingEmp({...editingEmp, totalSalary: e.target.value})} class="w-full border rounded p-2 font-bold text-emerald-700" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Ghi Chú</label>
                                    <input type="text" value={editingEmp.note || ''} placeholder="Ghi chú thêm..."
                                        onChange={e => setEditingEmp({...editingEmp, note: e.target.value})} class="w-full border rounded p-2" />
                                </div>
                                <div class="sm:col-span-2 mt-4 flex justify-end space-x-2 border-t pt-3">
                                    <button type="button" onClick={() => setEditingEmp(null)} class="px-4 py-2 border rounded font-semibold text-gray-600 hover:bg-gray-100">Hủy</button>
                                    <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded shadow">💾 Lưu Thay Đổi</button>
                                </div>
                            </form>
                        </div>
                    </div>
                )}

                {/* MODAL TÙY CHỈNH THỨ TỰ & BẬT/TẮT CỘT */}
                {showColModal && (
                    <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                        <div class="bg-white rounded-2xl p-6 max-w-lg w-full max-h-[85vh] flex flex-col">
                            <div class="flex justify-between items-center border-b pb-3 mb-4">
                                <div>
                                    <h3 class="font-bold text-lg text-gray-800">⚙️ Sắp Xếp & Chọn Cột Bảng Lương</h3>
                                    <p class="text-xs text-gray-500">Đổi thứ tự cột hoặc bỏ tích các cột không cần xuất</p>
                                </div>
                                <button onClick={() => setShowColModal(false)} class="text-gray-400 font-bold text-xl">✕</button>
                            </div>
                            <div class="flex-1 overflow-y-auto space-y-2 pr-2">
                                {columns.map((col, idx) => (
                                    <div key={col.key} class="flex items-center justify-between p-2.5 bg-slate-50 border rounded-lg hover:bg-indigo-50/50">
                                        <label class="flex items-center space-x-2 cursor-pointer select-none">
                                            <input type="checkbox" checked={col.enabled} onChange={() => toggleColumn(col.key)} />
                                            <span class={`text-xs font-semibold ${col.enabled ? 'text-gray-900' : 'text-gray-400 line-through'}`}>{col.label}</span>
                                        </label>
                                        <div class="flex space-x-1">
                                            <button onClick={() => moveColumn(idx, -1)} disabled={idx === 0}
                                                class="px-2 py-1 bg-white border rounded text-xs hover:bg-gray-100 disabled:opacity-30">⬆ Lên</button>
                                            <button onClick={() => moveColumn(idx, 1)} disabled={idx === columns.length - 1}
                                                class="px-2 py-1 bg-white border rounded text-xs hover:bg-gray-100 disabled:opacity-30">⬇ Xuống</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div class="border-t pt-4 mt-4 flex justify-between items-center">
                                <button onClick={resetColumns} class="text-xs text-indigo-600 hover:underline">Đặt lại chuẩn mẫu</button>
                                <button onClick={() => setShowColModal(false)} class="bg-indigo-600 text-white font-bold px-5 py-2 rounded-lg text-xs shadow">
                                    Đóng & Áp Dụng
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {/* MODAL THÊM TAY NHÂN SỰ */}
                {showManualModal && (
                    <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                        <div class="bg-white rounded-2xl p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                            <div class="flex justify-between items-center border-b pb-3 mb-4">
                                <h3 class="font-bold text-lg">Thêm Nhân Sự Mới</h3>
                                <button onClick={() => setShowManualModal(false)} class="text-gray-400 font-bold text-xl">✕</button>
                            </div>
                            <form onSubmit={handleManualSubmit} class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                <div>
                                    <label class="font-semibold block mb-1">Họ Và Tên Nhân Viên *</label>
                                    <input type="text" required value={manualForm.fullName}
                                        onChange={e => setManualForm({...manualForm, fullName: e.target.value})} class="w-full border rounded p-2" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Chức Vụ *</label>
                                    <select value={manualForm.role} onChange={e => setManualForm({...manualForm, role: e.target.value})} class="w-full border rounded p-2 bg-white">
                                        <option value="SUP">SUP</option>
                                        <option value="PG">PG</option>
                                        <option value="PB">PB</option>
                                        <option value="STAFF">STAFF</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Ngày Tháng Năm Sinh</label>
                                    <input type="text" value={manualForm.dob} placeholder="03/05/2005"
                                        onChange={e => setManualForm({...manualForm, dob: e.target.value})} class="w-full border rounded p-2" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Số CCCD *</label>
                                    <input type="text" required value={manualForm.idCardNumber}
                                        onChange={e => setManualForm({...manualForm, idCardNumber: e.target.value})} class="w-full border rounded p-2 font-mono" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Ngày Cấp</label>
                                    <input type="text" value={manualForm.idCardIssuedDate}
                                        onChange={e => setManualForm({...manualForm, idCardIssuedDate: e.target.value})} class="w-full border rounded p-2" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Nơi Cấp</label>
                                    <select value={manualForm.idCardIssuedPlace} onChange={e => setManualForm({...manualForm, idCardIssuedPlace: e.target.value})}
                                        class="w-full border rounded p-2 bg-white">
                                        <option value="BỘ CÔNG AN">BỘ CÔNG AN</option>
                                        <option value="Cục CS QLHC và TTXH">Cục CS QLHC và TTXH</option>
                                    </select>
                                </div>
                                <div class="sm:col-span-2">
                                    <label class="font-semibold block mb-1">Địa Chỉ (Trên CCCD)</label>
                                    <input type="text" value={manualForm.address}
                                        onChange={e => setManualForm({...manualForm, address: e.target.value})} class="w-full border rounded p-2" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Mã Số Thuế</label>
                                    <input type="text" value={manualForm.taxCode}
                                        onChange={e => setManualForm({...manualForm, taxCode: e.target.value})} class="w-full border rounded p-2 font-mono" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Số TK *</label>
                                    <input type="text" required value={manualForm.bankAccountNumber}
                                        onChange={e => setManualForm({...manualForm, bankAccountNumber: e.target.value})} class="w-full border rounded p-2 font-mono" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Ngân Hàng, Chi Nhánh *</label>
                                    <input type="text" required value={manualForm.bankInfo} placeholder="VD: Vietcombank - Tây Sài Gòn"
                                        onChange={e => setManualForm({...manualForm, bankInfo: e.target.value})} class="w-full border rounded p-2" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Mail</label>
                                    <input type="email" value={manualForm.email}
                                        onChange={e => setManualForm({...manualForm, email: e.target.value})} class="w-full border rounded p-2" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Số điện thoại</label>
                                    <input type="text" value={manualForm.phone}
                                        onChange={e => setManualForm({...manualForm, phone: e.target.value})} class="w-full border rounded p-2" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Tổng Lương</label>
                                    <input type="text" value={manualForm.totalSalary} placeholder="VD: 1.720.000"
                                        onChange={e => setManualForm({...manualForm, totalSalary: e.target.value})} class="w-full border rounded p-2" />
                                </div>
                                <div>
                                    <label class="font-semibold block mb-1">Ghi Chú</label>
                                    <input type="text" value={manualForm.note}
                                        onChange={e => setManualForm({...manualForm, note: e.target.value})} class="w-full border rounded p-2" />
                                </div>
                                <div class="sm:col-span-2 mt-4 flex justify-end space-x-2">
                                    <button type="button" onClick={() => setShowManualModal(false)} class="px-4 py-2 border rounded">Hủy</button>
                                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white font-bold rounded shadow">Lưu Nhân Sự</button>
                                </div>
                            </form>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
